[project]
name = "csi-sensing"
version = "0.1.0"
description = "WiFi CSI home sensing: sleep/breathing monitoring, activity recognition, and presence sensing on ESP32-S3 hardware"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ramiro Rivas" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyserial>=3.5",
    "gdown>=5.2",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
